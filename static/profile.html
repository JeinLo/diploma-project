<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Профиль | SkyFitnessPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="profile.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container header__container">
      <a href="index.html" class="logo">
        <img src="./images/Logo.svg" alt="SkyFitnessPro" class="logo__img" />
        <span class="logo__text">SkyFitnessPro</span>
      </a>
      <div class="user-menu">
        <div class="user-avatar">
          <img src="./images/avatar.svg" alt="Аватар" class="user-avatar-img">
        </div>
        <span class="user-name">Сергей</span>
        <span class="user-arrow-wrapper">
         <img src="./images/strelka.svg" alt="Стрелка" class="user-arrow">
         </span>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <div class="container">
      <!-- ЗАГОЛОВОК "Профиль" -->
      <h1 class="page-title">Профиль</h1>

      <!-- PROFILE CARD -->
      <section class="profile-card">
        <div class="profile-avatar">
          <img src="./images/avatar.svg" alt="Аватар" class="avatar-img" />
        </div>
        <div class="profile-info">
          <h1 class="profile-name">Сергей</h1>
          <p class="profile-login">Логин: sergey.petrov96</p>
          <button class="btn btn-logout" id="logout-btn-desktop">Выйти</button>
          <button class="btn btn--logout-mobile" id="logout-mobile">Выйти</button>
        </div>
      </section>

      <!-- MY COURSES -->
      <section class="my-courses">
        <h2 class="section-title">Мои курсы</h2>
        <div class="courses-grid" id="courses-container">
          <!-- Карточки будут добавлены JS -->
        </div>
      </section>
    </div>
  </main>

  <script src="profile.js"></script>
</body>
</html>
